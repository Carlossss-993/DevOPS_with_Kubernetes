apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: logoutput-gw
  namespace: exercises
spec:
  gatewayClassName: gke-l7-global-external-managed
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: All
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: logoutput-route
  namespace: exercises
spec:
  parentRefs:
    - name: logoutput-gw
  rules:
    - matches:
      - path:
          type: PathPrefix
          value: /
      backendRefs:
        - name: logoutput-svc
          port: 2010
    - matches:
      - path:
          type: PathPrefix
          value: /pingpong
      backendRefs:
        - name: pingpong-svc
          port: 2010
    - matches:
      - path:
          type: PathPrefix
          value: /pings
      backendRefs:
        - name: pingpong-svc
          port: 2010
          