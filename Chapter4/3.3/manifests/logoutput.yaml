apiVersion: v1
kind: Service
metadata:
  name: logoutput-svc
  namespace: exercises
spec:
  type: ClusterIP
  selector:
    app: logoutput
  ports:
    - protocol: TCP
      port: 2010
      targetPort: 3000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: logoutput-dep
  namespace: exercises
spec:
  replicas: 1
  selector:
    matchLabels:
      app: logoutput
  template:
    metadata:
      labels:
        app: logoutput
    spec:
      volumes:
        - name: logoutput-conf-vol
          configMap:
            name: logoutput-conf
      containers:
        - name: logoutput
          image: carlossss1011/logoutput
          imagePullPolicy: Always
          resources:
            requests:
              memory: "64Mi"
              cpu: "100m"
            limits:
              memory: "128Mi"
              cpu: "200m"
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: logoutput-conf
          volumeMounts:
            - name: logoutput-conf-vol
              mountPath: /app/config
              readOnly: true