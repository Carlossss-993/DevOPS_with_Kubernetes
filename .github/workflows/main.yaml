name: Release application

on:
  push:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: ${{ secrets.GKE_PROJECT }}
  GKE_CLUSTER: dwk-cluster
  GKE_ZONE: us-central1-a
  REGISTRY: us-central1-docker.pkg.dev
  REPOSITORY: dwk-repo
  BRANCH: ${{ github.ref_name }}

jobs:
  build-publish-deploy:
    name: Build, Publish and Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: '${{ secrets.WORKLOAD_IDENTITY_PROVIDER }}'
          service_account: '${{ secrets.SERVICE_ACCOUNT }}'

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud --quiet auth configure-docker $REGISTRY

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v2
        with:
          cluster_name: '${{ env.GKE_CLUSTER }}'
          project_id: '${{ env.PROJECT_ID }}'
          location: '${{ env.GKE_ZONE }}'

      - name: Form image tags
        run: |
          echo "TODOAPP_IMAGE=$REGISTRY/$PROJECT_ID/$REPOSITORY/todoapp:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV
          echo "TODOBACKEND_IMAGE=$REGISTRY/$PROJECT_ID/$REPOSITORY/todobackend:$BRANCH-$GITHUB_SHA" >> $GITHUB_ENV

      - name: Build Docker images
        run: |
          docker build --tag $TODOAPP_IMAGE ./Chapter4/3.6/todo-app
          docker build --tag $TODOBACKEND_IMAGE ./Chapter4/3.6/todo-backend

      - name: Publish Docker images
        run: |
          docker push $TODOAPP_IMAGE
          docker push $TODOBACKEND_IMAGE

      - name: Set up Kustomize
        uses: imranismail/setup-kustomize@v2

      - name: Deploy to GKE
        run: |
          cd Chapter4/3.6
          kustomize edit set image PROJECT/IMAGE/TODOAPP=$TODOAPP_IMAGE
          kustomize edit set image PROJECT/IMAGE/TODOBACKEND=$TODOBACKEND_IMAGE
          kustomize build . | kubectl apply -f -
          kubectl rollout status deployment todoapp-dep -n project
          kubectl rollout status deployment todobackend-dep -n project
          kubectl get services -n project -o wide