apiVersion: v1
kind: Service
metadata:
  name: todoapp-2-10-svc
  namespace: project
spec:
  type: ClusterIP
  selector:
    app: todoapp-2-10
  ports:
    - protocol: TCP
      port: 2010
      targetPort: 3000
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: todoapp-2-10-configmap
  namespace: project
data:
  PORT: "3000"
  IMAGE_URL: "https://picsum.photos/1200"
  TODO_BACKEND_URL: "http://todobackend-2-10-svc:2010/todos"
  DIRECTORY_PATH: "/app/files"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todoapp-2-10-dep
  namespace: project
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todoapp-2-10
  template:
    metadata:
      labels:
        app: todoapp-2-10
    spec:
      volumes:
        - name: todoapp-2-10-vol
          persistentVolumeClaim:
            claimName: todoapp-2-10-pvc
      containers:
        - name: todoapp-2-10-cont
          image: carlossss1011/2_10_todoapp
          imagePullPolicy: Always
          ports:
            - containerPort: 3000
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "256Mi"
              cpu: "250m"
          envFrom:
            - configMapRef:
                name: todoapp-2-10-configmap
          volumeMounts:
            - name: todoapp-2-10-vol
              mountPath: /app/files