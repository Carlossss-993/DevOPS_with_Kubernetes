apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: exercises
type: Opaque
stringData:
  POSTGRES_PASSWORD: "pingpongpass"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: exercises
data:
  POSTGRES_DB: "pingpong_db"
  POSTGRES_USER: "pingpong_user"
  POSTGRES_HOST: "postgres-svc"
  POSTGRES_PORT: "5432"