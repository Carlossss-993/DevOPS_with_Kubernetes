apiVersion: v1
kind: Secret
metadata:
  name: postgres-secret
  namespace: project
type: Opaque
stringData:
  POSTGRES_PASSWORD: "projectpass"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-config
  namespace: project
data:
  POSTGRES_DB: "project_db"
  POSTGRES_USER: "project_user"
  POSTGRES_HOST: "postgres-svc"
  POSTGRES_PORT: "5432"